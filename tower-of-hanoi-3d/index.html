<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉诺塔 2D 学习游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            align-items: center;
        }
        
        label { font-weight: bold; }
        
        input[type="number"] {
            padding: 5px 10px;
            border: 2px solid #3498db;
            border-radius: 5px;
            width: 60px;
            text-align: center;
        }
        
        button {
            padding: 8px 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        
        button:hover { background: #2980b9; transform: translateY(-2px); }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        
        .stats {
            font-size: 1.1em;
            font-weight: bold;
            margin: 10px 0;
            color: #e74c3c;
        }
        
        /* 棋盘 */
        .board {
            display: flex;
            justify-content: space-around;
            height: 300px;
            margin: 20px 0;
            position: relative;
        }
        
        /* 柱子 */
        .peg {
            width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .peg::before {
            content: '';
            position: absolute;
            bottom: 0;
            width: 8px;
            height: 200px;
            background: linear-gradient(to right, #8b4513, #a0522d, #8b4513);
            border-radius: 4px 4px 0 0;
            z-index: 1;
        }
        
        .peg-label {
            position: absolute;
            bottom: -30px;
            font-weight: bold;
            font-size: 1.2em;
            color: #2c3e50;
        }
        
        .disks-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            height: 200px;
            z-index: 2;
        }
        
        /* 盘子 */
        .disk {
            height: 20px;
            border-radius: 10px;
            margin: 2px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        }
        
        /* 彩虹色盘子 */
        .disk[data-size="1"] { background: linear-gradient(to right, #ff6b6b, #ff8e8e); width: 40px; }
        .disk[data-size="2"] { background: linear-gradient(to right, #feca57, #ffd166); width: 60px; }
        .disk[data-size="3"] { background: linear-gradient(to right, #48dbfb, #54a0ff); width: 80px; }
        .disk[data-size="4"] { background: linear-gradient(to right, #1dd1a1, #10ac84); width: 100px; }
        .disk[data-size="5"] { background: linear-gradient(to right, #5f27cd, #341f97); width: 120px; }
        .disk[data-size="6"] { background: linear-gradient(to right, #ff9ff3, #f368e0); width: 140px; }
        .disk[data-size="7"] { background: linear-gradient(to right, #feca57, #ff9f43); width: 160px; }
        .disk[data-size="8"] { background: linear-gradient(to right, #ff6b6b, #ee5a24); width: 180px; }
        
        /* 动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .shake { animation: shake 0.5s; }
        
        /* 消息 */
        .message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .message.show { opacity: 1; }
        .message.error { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗼 汉诺塔学习游戏</h1>
        
        <div class="controls">
            <label for="disk-count">盘子数量 (3-8):</label>
            <input type="number" id="disk-count" min="3" max="8" value="3">
            <button id="reset-btn">重置</button>
            <button id="solve-btn">自动求解</button>
        </div>
        
        <div class="stats">
            移动次数: <span id="move-count">0</span>
        </div>
        
        <!-- 棋盘 -->
        <div class="board">
            <div class="peg" data-peg="A">
                <div class="disks-container" id="peg-A"></div>
                <div class="peg-label">A</div>
            </div>
            <div class="peg" data-peg="B">
                <div class="disks-container" id="peg-B"></div>
                <div class="peg-label">B</div>
            </div>
            <div class="peg" data-peg="C">
                <div class="disks-container" id="peg-C"></div>
                <div class="peg-label">C</div>
            </div>
        </div>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            diskCount: 3,
            towers: { A: [], B: [], C: [] },
            moves: 0,
            isAutoSolving: false,
            selectedDisk: null,
            selectedTower: null
        };

        // DOM 元素
        const dom = {
            diskCountInput: document.getElementById('disk-count'),
            resetBtn: document.getElementById('reset-btn'),
            solveBtn: document.getElementById('solve-btn'),
            moveCountSpan: document.getElementById('move-count'),
            messageDiv: document.getElementById('message')
        };

        // 初始化游戏
        function initGame() {
            const count = parseInt(dom.diskCountInput.value);
            if (count < 3 || count > 8) {
                showMessage('请输入 3 到 8 之间的数字', true);
                return;
            }
            
            gameState.diskCount = count;
            gameState.towers = { A: [], B: [], C: [] };
            gameState.moves = 0;
            gameState.selectedDisk = null;
            gameState.selectedTower = null;
            
            // 填充 A 塔
            for (let i = count; i >= 1; i--) {
                gameState.towers.A.push(i);
            }
            
            render();
            updateMoveCount();
            showMessage('游戏开始！点击盘子然后点击目标柱子移动', false);
        }

        // 渲染游戏
        function render() {
            // 清空所有柱子
            document.querySelectorAll('.disks-container').forEach(container => {
                container.innerHTML = '';
            });
            
            // 绘制每个塔
            Object.keys(gameState.towers).forEach(towerKey => {
                const container = document.getElementById(`peg-${towerKey}`);
                const tower = gameState.towers[towerKey];
                
                tower.forEach((diskSize, index) => {
                    const disk = document.createElement('div');
                    disk.className = 'disk';
                    disk.dataset.size = diskSize;
                    disk.textContent = diskSize;
                    disk.style.transform = `translateY(${index * 2}px)`;
                    
                    // 添加点击事件
                    disk.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (gameState.isAutoSolving) return;
                        handleDiskClick(towerKey, diskSize);
                    });
                    
                    container.appendChild(disk);
                });
            });
        }

        // 点击盘子
        function handleDiskClick(towerKey, diskSize) {
            if (gameState.isAutoSolving) return;
            
            const tower = gameState.towers[towerKey];
            
            // 只能点击最顶部的盘子
            if (tower.length > 0 && tower[tower.length - 1] === diskSize) {
                if (gameState.selectedDisk) {
                    // 如果已选中盘子，尝试移动
                    moveDisk(gameState.selectedTower, towerKey);
                } else {
                    // 否则选中盘子
                    gameState.selectedDisk = diskSize;
                    gameState.selectedTower = towerKey;
                    showMessage(`选中了盘子 ${diskSize}，请选择目标柱子`, false);
                }
            }
        }

        // 移动盘子
        function moveDisk(fromTower, toTower) {
            if (fromTower === toTower) {
                gameState.selectedDisk = null;
                gameState.selectedTower = null;
                render();
                return;
            }
            
            const diskSize = gameState.towers[fromTower].pop();
            const targetTower = gameState.towers[toTower];
            
            // 检查是否合法
            if (targetTower.length > 0 && targetTower[targetTower.length - 1] < diskSize) {
                // 非法移动
                showMessage('❌ 不能把大盘子放在小盘子上！', true);
                gameState.towers[fromTower].push(diskSize);
            } else {
                // 合法移动
                targetTower.push(diskSize);
                gameState.moves++;
                updateMoveCount();
                showMessage(`移动盘子 ${diskSize} 从 ${fromTower} 到 ${toTower}`, false);
                
                // 检查胜利
                if (gameState.towers.C.length === gameState.diskCount) {
                    showMessage(`🎉 恭喜你完成了！总共用了 ${gameState.moves} 步`, false);
                }
            }
            
            gameState.selectedDisk = null;
            gameState.selectedTower = null;
            render();
        }

        // 更新移动计数
        function updateMoveCount() {
            dom.moveCountSpan.textContent = gameState.moves;
        }

        // 显示消息
        function showMessage(text, isError = false) {
            dom.messageDiv.textContent = text;
            dom.messageDiv.className = 'message show';
            if (isError) {
                dom.messageDiv.classList.add('error');
            }
            
            setTimeout(() => {
                dom.messageDiv.classList.remove('show');
            }, 2000);
        }

        // 自动求解
        function startAutoSolve() {
            if (gameState.isAutoSolving) return;
            showMessage('自动求解功能开发中...', false);
        }

        // 事件监听
        dom.resetBtn.addEventListener('click', initGame);
        dom.solveBtn.addEventListener('click', startAutoSolve);
        dom.diskCountInput.addEventListener('change', initGame);

        // 点击棋盘空白处取消选择
        document.querySelector('.board').addEventListener('click', (e) => {
            if (e.target.classList.contains('board') || e.target.classList.contains('peg')) {
                if (gameState.selectedDisk) {
                    gameState.selectedDisk = null;
                    gameState.selectedTower = null;
                    render();
                }
            }
        });

        // 初始化
        initGame();
    </script>
</body>
</html>
